<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101923" />
    <meta name="description" content="Un module CTF pour découvrir Linux, puis 42 missions pratiques d’administration AlmaLinux dans une VM." />
    <title>Linux, pour de vrai — parcours Linux et administration</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="cours-data.js" defer></script>
    <script src="modules/01/module01-data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <header class="topbar">
      <button class="brand" data-route="accueil" aria-label="Retour à l’accueil"><span class="brand-mark">$_</span><span>Linux, pour de vrai</span></button>
      <div class="topbar-right"><span class="status-dot"></span> Parcours Linux & administration <span class="version">v2.0</span></div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Navigation du parcours">
        <div class="sidebar-kicker">VOTRE PARCOURS</div>
        <label class="mobile-nav-label" for="mission-select">Aller à une mission</label>
        <select id="mission-select" class="mobile-nav-select" aria-label="Choisir une mission"></select>
        <div class="sidebar-bottom">
          <button class="side-link module01-side-link" data-view="module-01"><span>⚑</span> Module 01 · CTF <span id="module01-count" class="due-badge">0/7</span></button>
          <div class="side-progress"><span id="progress-side">0 / 42 missions</span><span id="progress-percent">0 %</span></div>
          <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
          <button class="side-link" data-view="revision"><span>↻</span> Révisions <span id="due-count" class="due-badge">0</span></button>
          <button class="side-link" data-view="cours"><span>▤</span> Cours express</button>
          <button class="side-link" data-view="guide"><span>⌘</span> Guide de survie</button>
        </div>
        <nav id="nav" aria-label="Missions"></nav>
      </aside>

      <main id="contenu" class="main" tabindex="-1">
        <div id="view"></div>
      </main>
    </div>

  </body>
</html>
